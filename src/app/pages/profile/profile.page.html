<div class="min-h-screen bg-white font-sans">
  <app-navbar></app-navbar>

  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-16">

    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">My Account</h1>
      <p class="text-slate-500 mt-1">Manage your profile and settings</p>
    </div>

    <!-- Profile Card -->
    <div *ngIf="user" class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

      <!-- Avatar Banner -->
      <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-28 relative">
        <div class="absolute -bottom-10 left-8">
          <div class="w-20 h-20 bg-white rounded-2xl border-4 border-white shadow-lg flex items-center justify-center">
            <span class="text-3xl font-bold text-indigo-600">
              {{(user.email[0] | uppercase)}}
            </span>
          </div>
        </div>
      </div>

      <div class="pt-14 px-8 pb-8 space-y-6">
        <!-- User Info -->
        <div>
          <h2 class="text-xl font-bold text-slate-900">{{user.email}}</h2>
          <div class="flex items-center gap-2 mt-1">
            <span class="inline-flex items-center bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full capitalize">
              {{user.role}}
            </span>
            <span class="text-slate-400 text-xs">Tenant #{{user.tenantId}}</span>
          </div>
        </div>

        <!-- Info Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">Email</p>
            <p class="text-slate-900 font-medium text-sm">{{user.email}}</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">Account ID</p>
            <p class="text-slate-900 font-medium text-sm">#{{user.id}}</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">Role</p>
            <p class="text-slate-900 font-medium text-sm capitalize">{{user.role}}</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">Store</p>
            <p class="text-slate-900 font-medium text-sm">Tenant #{{user.tenantId}}</p>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="flex flex-wrap gap-3 pt-2 border-t border-slate-100">
          <a routerLink="/home"
            class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-slate-50 transition-all shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            Browse Store
          </a>
          <a routerLink="/cart"
            class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-slate-50 transition-all shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            My Cart
          </a>
          <button (click)="logout()"
            class="flex items-center gap-2 bg-red-50 border border-red-100 text-red-600 text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-red-100 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Sign Out
          </button>
        </div>
      </div>
    </div>

  </div>

  <app-footer></app-footer>
  <app-toast-container></app-toast-container>
</div>

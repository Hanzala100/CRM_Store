<nav *ngIf="storeConfigService.config$ | async as config" class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/home" class="flex items-center gap-2 group">
        <div *ngIf="!config.brand.logo_url" class="w-8 h-8 bg-gradient-to-br from-primary to-accent rounded-lg flex items-center justify-center shadow-sm group-hover:shadow-md transition-all">
          <span class="text-white font-bold text-sm">{{config.brand.store_name[0] || 'S'}}</span>
        </div>
        <img *ngIf="config.brand.logo_url" [src]="config.brand.logo_url" alt="Logo" class="max-w-[120px] max-h-8 object-contain">
        <span class="text-slate-900 font-semibold text-lg tracking-tight">{{config.brand.store_name}}</span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8">
        <a routerLink="/home" routerLinkActive="text-indigo-600" [routerLinkActiveOptions]="{exact:true}"
          class="text-slate-600 hover:text-slate-900 text-sm font-medium transition-colors">
          Home
        </a>
        <a routerLink="/home" fragment="products"
          class="text-slate-600 hover:text-slate-900 text-sm font-medium transition-colors">
          Products
        </a>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <!-- Cart -->
        <a routerLink="/cart" class="relative group">
          <div class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-slate-100 transition-colors cursor-pointer">
            <svg class="w-5 h-5 text-slate-600 group-hover:text-indigo-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
          </div>
          <span *ngIf="cartCount > 0"
            class="absolute -top-1 -right-1 bg-primary text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-semibold shadow-sm">
            {{cartCount}}
          </span>
        </a>

        <!-- Auth buttons -->
        <ng-container *ngIf="!authService.isLoggedIn">
          <a routerLink="/login"
            class="text-sm text-slate-600 hover:text-slate-900 font-medium transition-colors hidden md:block">
            Sign in
          </a>
          <a routerLink="/register"
            class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-xl hover:opacity-90 shadow-sm hover:shadow-md transition-all">
            Get Started
          </a>
        </ng-container>

        <ng-container *ngIf="authService.isLoggedIn">
          <a routerLink="/profile"
            class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-slate-100 transition-colors cursor-pointer">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </a>
        </ng-container>

        <!-- Mobile menu btn -->
        <button (click)="toggleMenu()" class="md:hidden w-10 h-10 flex items-center justify-center rounded-xl hover:bg-slate-100 transition-colors">
          <svg *ngIf="!isMenuOpen" class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg *ngIf="isMenuOpen" class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden py-3 pb-4 border-t border-slate-100 space-y-1">
      <a routerLink="/home" (click)="toggleMenu()"
        class="block px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition-colors">Home</a>
      <a routerLink="/cart" (click)="toggleMenu()"
        class="block px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition-colors">Cart ({{cartCount}})</a>
      <ng-container *ngIf="!authService.isLoggedIn">
        <a routerLink="/login" (click)="toggleMenu()"
          class="block px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition-colors">Sign In</a>
        <a routerLink="/register" (click)="toggleMenu()"
          class="block px-3 py-2 rounded-xl text-indigo-600 hover:bg-indigo-50 text-sm font-medium transition-colors">Get Started</a>
      </ng-container>
      <ng-container *ngIf="authService.isLoggedIn">
        <a routerLink="/profile" (click)="toggleMenu()"
          class="block px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition-colors">Profile</a>
        <button (click)="logout(); toggleMenu()"
          class="block w-full text-left px-3 py-2 rounded-xl text-red-500 hover:bg-red-50 text-sm font-medium transition-colors">Sign Out</button>
      </ng-container>
    </div>
  </div>
</nav>

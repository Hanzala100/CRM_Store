<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none">
  <div *ngFor="let toast of toasts"
    [class]="'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-2xl border shadow-lg animate-slide-up ' + getToastClasses(toast.type)"
    style="min-width: 280px; max-width: 400px;">

    <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
      [innerHTML]="getIconSvg(toast.type)">
    </svg>

    <p class="text-sm font-medium flex-1 leading-relaxed">{{toast.message}}</p>

    <button (click)="removeToast(toast.id)"
      class="flex-shrink-0 opacity-60 hover:opacity-100 transition-opacity">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
